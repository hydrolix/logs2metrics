name: Build and push image

# Builds upstream's Dockerfile unchanged: version info goes in through its
# VERSION/COMMIT/DATE build args, provenance through OCI labels. The image
# path and WIF identity come from the GitHub environment's variables.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy through (dev or release)
        type: string
        required: true
      version:
        description: Version stamped into the binary and the image label
        type: string
        required: true
      tags:
        description: Space-separated image tags to push
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Each architecture builds and is checked natively on its own runner, then
  # pushes an <tag>-<arch> image; "manifest" joins them under the real tags.
  image:
    name: Build and push ${{ matrix.arch }} (${{ inputs.environment }})
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write  # mint the GitHub OIDC token exchanged for GCP credentials
    outputs:
      first: ${{ steps.validate.outputs.first }}
      registry_host: ${{ steps.validate.outputs.registry_host }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
      VERSION: ${{ inputs.version }}
      TAGS: ${{ inputs.tags }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tags
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$IMAGE_REPOSITORY" ]] || { echo "::error::vars.IMAGE_REPOSITORY is not set in the $ENVIRONMENT environment"; exit 1; }
          read -ra tags <<< "$TAGS"
          [[ ${#tags[@]} -gt 0 ]] || { echo "::error::no tags given"; exit 1; }
          for tag in "${tags[@]}"; do
            # 121, not docker's 128: each tag also gets an -amd64/-arm64 copy.
            [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,120}$ ]] || { echo "::error::'$tag' is not a valid docker tag"; exit 1; }
            # Defense in depth: only release may move release tags, even if
            # dev and release ever point at the same image path.
            if [[ "$ENVIRONMENT" != "release" && ( "$tag" == v* || "$tag" == "latest" ) ]]; then
              echo "::error::the $ENVIRONMENT environment may not push release tag '$tag'"
              exit 1
            fi
          done
          echo "first=${tags[0]}" >> "$GITHUB_OUTPUT"
          echo "registry_host=${IMAGE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Build image
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_REPOSITORY }}:${{ steps.validate.outputs.first }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker buildx build \
            --platform "linux/$ARCH" \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            --build-arg DATE="$created" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.created="$created" \
            -t "$IMAGE" \
            --load .

      - name: Check stamped version and architecture
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_REPOSITORY }}:${{ steps.validate.outputs.first }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          arch="$(docker image inspect --format '{{.Architecture}}' "$IMAGE")"
          [[ "$arch" == "$ARCH" ]] || { echo "::error::image is $arch, expected $ARCH"; exit 1; }
          out="$(docker run --rm "$IMAGE" version)"
          echo "$out"
          grep -qxF "version: $VERSION" <<< "$out" || { echo "::error::image reports a version other than $VERSION"; exit 1; }

      - name: Authenticate GAR (Workload Identity Federation)
        uses: ./.github/actions/setup-google-application-credentials
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          registry_host: ${{ steps.validate.outputs.registry_host }}

      - name: Push ${{ matrix.arch }} image
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_REPOSITORY }}:${{ steps.validate.outputs.first }}-${{ matrix.arch }}
        run: docker push "$IMAGE"

  manifest:
    name: Publish multi-arch tags (${{ inputs.environment }})
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write  # mint the GitHub OIDC token exchanged for GCP credentials
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
      VERSION: ${{ inputs.version }}
      TAGS: ${{ inputs.tags }}
      FIRST: ${{ needs.image.outputs.first }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate GAR (Workload Identity Federation)
        uses: ./.github/actions/setup-google-application-credentials
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          registry_host: ${{ needs.image.outputs.registry_host }}

      - name: Create and push multi-arch tags
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          for tag in $TAGS; do tag_args+=(-t "$IMAGE_REPOSITORY:$tag"); done
          docker buildx imagetools create "${tag_args[@]}" \
            "$IMAGE_REPOSITORY:$FIRST-amd64" \
            "$IMAGE_REPOSITORY:$FIRST-arm64"

      - name: Check both platforms are published
        shell: bash
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            # Attestation manifests, if the build ever adds them, list as unknown/unknown.
            platforms="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$tag" | awk '$1 == "Platform:" && $2 != "unknown/unknown" {print $2}' | sort | tr '\n' ' ')"
            [[ "$platforms" == "linux/amd64 linux/arm64 " ]] || { echo "::error::$tag has platforms '$platforms', expected linux/amd64 and linux/arm64"; exit 1; }
          done
          digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$FIRST" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          {
            echo "### Pushed \`$VERSION\` to $ENVIRONMENT (linux/amd64, linux/arm64)"
            echo
            for tag in $TAGS; do echo "- \`$IMAGE_REPOSITORY:$tag\`"; done
            echo
            echo "Digest: \`$IMAGE_REPOSITORY@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
